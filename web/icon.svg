<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="silver-wombat">
  <!-- A terminal prompt. The background fills the square: iOS and Android cut their own corners. -->
  <rect width="512" height="512" fill="#0b0d12" />
  <rect x="64" y="64" width="384" height="384" rx="72" fill="#161a23" stroke="#2c3344" stroke-width="8" />
  <polyline points="156,196 236,256 156,316" fill="none" stroke="#7aa7ff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="268" y1="324" x2="360" y2="324" stroke="#e6e8ee" stroke-width="40" stroke-linecap="round" />
</svg>
