name: Release

# Publish:
#   1. Set `version` in Cargo.toml to the new X.Y.Z and merge that to main.
#   2. Tag the merged commit on main and push only that tag:
#      `git switch main && git pull && git tag vX.Y.Z && git push origin vX.Y.Z`
# The release fails unless the tag is "v" + the Cargo.toml version, the tagged commit
# is on main, and it passes the same checks as ci.yml. GitHub runs the release.yml
# from the tagged commit, so a tag on a commit from before these checks, or on a commit
# that edits this file, skips them. Use a tag ruleset to restrict who can create v* tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ci.yml's repo, fmt, clippy and test gates, run on the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Tag matches Cargo.toml version
        run: test "v$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')" = "$GITHUB_REF_NAME"
      - name: Build release binary
        run: |
          cargo build --release
          mkdir -p dist
          cp "target/release/silver-wombat" "dist/silver-wombat-$(uname -m)-linux"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
