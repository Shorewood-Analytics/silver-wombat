name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs these same gates on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Only PR runs share a group. Every push/dispatch gets its own group so a
  # newer merge cannot replace a pending ci run that auto-release needs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No junk, databases or secrets committed
        run: |
          # -z: without it git prints paths with non-ASCII, ", \ or control characters quoted, so `$` never matches.
          # LC_ALL=C: match byte-wise, so names that are not valid UTF-8 are checked too.
          # tr: one path per line, as before; a newline inside a path is shown as '?'.
          export LC_ALL=C
          bad=$(git ls-files -z | grep -zEi '(^|/)(\.DS_Store|\.env(\..+)?|\.netrc|credentials\.json|secrets\.[^/]+|[^/]+\.((db|sqlite3?)(-journal|-wal|-shm)?|duckdb(\.wal)?|mdb|accdb|dump|pgdump|pem|key|p12|pfx))$' | grep -zv '\.env\.example$' | tr '\0\n' '\n?' || true)
          if [ -n "$bad" ]; then echo "::error::remove from git: $bad"; exit 1; fi

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      # Root commands cover the crates that build on any machine (core, xtask).
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The browser app: lint it for the WASM target and build the static site.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Keep in step with APP_TOOLCHAIN in xtask/src/main.rs.
      APP_TOOLCHAIN: nightly-2026-10-31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the app toolchain
        run: rustup toolchain install "$APP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/wasm-bindgen
            target
          key: app-${{ runner.os }}-${{ env.APP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            app-${{ runner.os }}-${{ env.APP_TOOLCHAIN }}-
      - name: Install wasm-bindgen at the version in Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          test -n "$version" || { echo "::error::no wasm-bindgen entry in Cargo.lock"; exit 1; }
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen $version"; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - run: cargo xtask check
      - run: cargo xtask dist
      - name: The site has every file it needs
        run: |
          for file in index.html boot.js app.css sw.js manifest.webmanifest icon-180.png icon-192.png icon-512.png silver_wombat_app.js silver_wombat_app_bg.wasm python-worker.js complete-worker.js ml/transformers.min.js ml/ort-wasm-simd-threaded.asyncify.mjs ml/ort-wasm-simd-threaded.asyncify.wasm; do
            test -s "dist/$file" || { echo "::error::dist/$file is missing or empty"; exit 1; }
          done
          for version in 3.12 3.13 3.14 3.15; do
            for file in pyodide.mjs pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
              test -s "dist/python/$version/$file" || { echo "::error::dist/python/$version/$file is missing or empty"; exit 1; }
            done
          done
          if grep -q '__VERSION__\|__SHELL__' dist/sw.js; then echo "::error::dist/sw.js was not filled in"; exit 1; fi
          ls -l dist dist/python/*
          du -sh dist
      # Starts the built site in Chrome and operates it through its
      # accessibility layer: demo repository, edit, save states, terminal,
      # commit, reload recovery, keyboard, an axe scan of every pane, and
      # Python 3.12 to 3.15, including downloading numpy from Pyodide's CDN
      # and a package from PyPI (so this step needs the network). Code
      # suggestions are tested here with a stand-in model of a few kilobytes.
      - name: Run the site in a browser
        run: |
          npm ci --prefix e2e
          node e2e/smoke.mjs
      # The real suggestion model, about 320 MB from Hugging Face, loaded and
      # run in Chrome on software WebGPU and on the CPU. It reports what the
      # model suggested and how long that took. A failure here is shown but
      # does not fail the job: it depends on a download from another site.
      - name: Run the real suggestion model in a browser
        continue-on-error: true
        timeout-minutes: 25
        run: node e2e/model.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure
          path: e2e/failure.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 14

  # The same browser test in WebKit, the engine Safari is built on. This is
  # not Safari and not iOS: it is the nearest thing that runs on a Linux
  # machine. Its result is shown on the pull request but does not gate a merge.
  webkit:
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install WebKit
        working-directory: e2e
        run: |
          npm ci
          npx playwright-core install --with-deps webkit
      - name: Run the site in WebKit
        run: BROWSER=webkit node e2e/smoke.mjs

  # The single required check in the branch ruleset. It passes only if every job above passed.
  ci:
    if: always()
    needs: [repo, rust, app]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
