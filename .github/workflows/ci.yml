name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only PR runs share a group. Every push/dispatch gets its own group so a
  # newer merge cannot replace a pending ci run that auto-release needs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No junk, databases or secrets committed
        run: |
          # -z: without it git prints paths with non-ASCII, ", \ or control characters quoted, so `$` never matches.
          # LC_ALL=C: match byte-wise, so names that are not valid UTF-8 are checked too.
          # tr: one path per line, as before; a newline inside a path is shown as '?'.
          export LC_ALL=C
          bad=$(git ls-files -z | grep -zEi '(^|/)(\.DS_Store|\.env(\..+)?|[^/]+\.(db|sqlite3?|duckdb|pem|key|p12|pfx))$' | grep -zv '\.env\.example$' | tr '\0\n' '\n?' || true)
          if [ -n "$bad" ]; then echo "::error::remove from git: $bad"; exit 1; fi

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The single required check in the branch ruleset. It passes only if every job above passed.
  ci:
    if: always()
    needs: [repo, rust]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
