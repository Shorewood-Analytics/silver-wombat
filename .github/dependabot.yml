version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
  # The Python interpreters (Pyodide). A new version here must be matched in
  # RUNTIMES in crates/core/src/python.rs; a test fails until it is.
  - package-ecosystem: npm
    directory: /web/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-runtimes:
        patterns: ["*"]
  # The runtime for the code-suggestion model (Transformers.js, ONNX Runtime).
  - package-ecosystem: npm
    directory: /web/ml
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ml-runtime:
        patterns: ["*"]
