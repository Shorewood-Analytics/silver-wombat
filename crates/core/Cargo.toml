[package]
name = "silver-wombat-core"
description = "GitHub-backed workspace, continuous save and shell for the silver-wombat browser IDE"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.22"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
similar = "2"

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
